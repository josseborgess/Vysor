<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VYSOR · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07090D;--card:#0F131A;--line:rgba(255,255,255,.08);--tx:#F2F4F8;--mut:#8D96A6;--cy:#5EE7FF;--ok:#3DDC97;--warn:#FFC857;--bad:#FF5C7A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.5 Inter,sans-serif}
  h1,h2,.num{font-family:'Space Grotesk',sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .logo{font:700 20px 'Space Grotesk';letter-spacing:.35em}
  .logo small{display:block;font:500 11px Inter;letter-spacing:.25em;color:var(--cy);margin-top:2px}
  .btn{background:var(--tx);color:#000;border:0;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer}
  .btn.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .mode{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
  .mode.test{color:var(--warn);border-color:rgba(255,200,87,.4)}
  .mode.live{color:var(--ok);border-color:rgba(61,220,151,.4)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .kpi .num{font-size:28px;font-weight:600}
  .kpi span{color:var(--mut);font-size:12px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .bar input,.bar select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
  .bar input{flex:1 1 220px}
  .order{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .head{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 16px;cursor:pointer}
  .head .who{font-weight:600}
  .head .sub{color:var(--mut);font-size:12px}
  .right{text-align:right}
  .amt{font:600 18px 'Space Grotesk'}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:middle}
  .ok{background:rgba(61,220,151,.12);color:var(--ok)}
  .bad{background:rgba(255,92,122,.12);color:var(--bad)}
  .warn{background:rgba(255,200,87,.12);color:var(--warn)}
  .st{background:rgba(94,231,255,.1);color:var(--cy)}
  .body{display:none;border-top:1px solid var(--line);padding:16px;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .order.open .body{display:grid}
  .box h3{margin:0 0 8px;font:600 12px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .box p{margin:2px 0}
  .box a{color:var(--cy)}
  .row{display:flex;justify-content:space-between;gap:10px}
  .check{font-size:12px}
  .edit{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:14px}
  .edit select,.edit input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .edit input{flex:1 1 180px}
  .empty{color:var(--mut);text-align:center;padding:50px 0}
  .login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
  .login input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:14px 0}
  .err{color:var(--bad);font-size:13px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:#000;padding:10px 18px;border-radius:999px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="logo">VYSOR<small>PANEL DE PEDIDOS</small></div>
  <form id="lf">
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <input id="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="Código de 6 dígitos (app del celular)" autocomplete="one-time-code" required style="margin-top:0">
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <header>
    <div class="logo">VYSOR<small>PANEL DE PEDIDOS</small></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="mode" class="mode"></span>
      <button class="btn g" id="csv">Exportar CSV</button>
      <button class="btn g" id="refresh">Actualizar</button>
      <button class="btn g" id="out">Salir</button>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="num" id="k1">0</div><span>Pedidos verificados</span></div>
    <div class="kpi"><div class="num" id="k2">$0</div><span>Vendido (verificado)</span></div>
    <div class="kpi"><div class="num" id="k3">0</div><span>Por enviar</span></div>
    <div class="kpi"><div class="num" id="k4">0</div><span>Con alerta</span></div>
  </div>

  <div class="bar">
    <input id="q" placeholder="Buscar por nombre, correo, teléfono, producto o ID">
    <select id="f">
      <option value="">Todos los estados</option>
      <option value="nuevo">Nuevo</option>
      <option value="preparando">Preparando</option>
      <option value="enviado">Enviado</option>
      <option value="entregado">Entregado</option>
      <option value="cancelado">Cancelado</option>
      <option value="alerta">Con alerta</option>
    </select>
  </div>

  <div id="list"></div>
  <div style="text-align:center;margin-top:14px"><button class="btn g" id="more" hidden>Cargar más</button></div>
  <p style="color:var(--mut);font-size:12px;margin-top:24px">Los datos se leen en vivo desde Stripe. "Verificado" significa que Stripe confirmó el cobro y no hay reembolso ni disputa. Se actualiza solo cada minuto.</p>
</div>
<div class="toast" id="toast"></div>

<script src="/pedidos.js" defer></script>
</body>
</html>
