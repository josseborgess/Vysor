[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html gracias.html pedidos.html robots.txt catalog.json app.js chat.js fx.js intro.js liquidnav.js pedidos.js gracias.js styles.css chat.css img vendor dist/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["catalog.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pedidos"
  to = "/pedidos.html"
  status = 200

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/vercel.json"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pedidos*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

